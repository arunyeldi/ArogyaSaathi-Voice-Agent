<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Medical Heart + Soundwave Icon -->
  <g transform="translate(10, 5)">
    <circle cx="20" cy="20" r="18" fill="url(#logo-grad)" opacity="0.15" />
    <circle cx="20" cy="20" r="15" fill="none" stroke="url(#logo-grad)" stroke-width="2" />
    <!-- Heart Pulse Wave Line -->
    <path d="M 8 20 L 13 20 L 16 13 L 20 27 L 24 16 L 27 22 L 32 20" fill="none" stroke="#14b8a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  </g>

  <!-- Typography -->
  <text x="54" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" fill="#ffffff" letter-spacing="-0.5">Arogya<tspan fill="#14b8a6">Saathi</tspan></text>
  <text x="55" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="8" fill="#94a3b8" letter-spacing="1">AI HEALTH COMPANION</text>
</svg>
